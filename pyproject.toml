[project]
name = "llm-audit"
version = "0.1.0"
description = "llm_audit module"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.10.1",
    "datasets>=4.4.1",
    "deepl>=1.27.0",
    "flashinfer-python>=0.3.1",
    "hydra-core>=1.3.2",
    "hydra-optuna-sweeper>=1.2.0",
    "ipykernel>=6.30.1",
    "ipython>=9.5.0",
    "krippendorff>=0.8.2",
    "loguru>=0.7.3",
    "mypy>=1.18.2",
    "nbformat>=5.10.4",
    "nvidia-ml-py>=13.580.82",
    "openai>=1.109.1",
    "pandas>=2.3.2",
    "pandas-stubs>=2.3.2.250926",
    "pingouin>=0.5.5",
    "plotly>=6.5.0",
    "pytest>=8.4.2",
    "quapy>=0.2.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "sentence-transformers>=5.4.1",
    "torch>=2.8.0",
    "transformers[torch]>=4.56.2",
    "types-pyyaml>=6.0.12.20260724",
    "types-seaborn>=0.13.2.20260518",
    "types-tqdm>=4.67.0.20250809",
    "vllm==0.11.0",
    "wandb>=0.26.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ruff>=0.14.4",
    "ipywidgets>=8.1.8",
]

[tool.setuptools]
packages = ["llm_audit"]

[tool.uv.workspace]
members = [
    ".",
]

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["sklearn.*", "krippendorff.*", "joblib.*", "quapy.*", "deepl.*", "wandb.*"]
ignore_missing_imports = true

[tool.ty.environment]
python = "./.venv"

[tool.ruff]
# Allow lines to be as long as 120.
line-length = 120
